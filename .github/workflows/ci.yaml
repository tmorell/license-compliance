name: CI

on:
  push:
    paths-ignore:
      - "*.md"
    branches:
      - master
  pull_request:
    paths-ignore:
      - "*.md"
    branches:
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version:
          - "20"
          - "22"
          - "24"
          - "26"
    name: Node ${{ matrix.node_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # 7.0.0
        with:
          node-version: ${{ matrix.node_version }}
          cache: "npm"

      - name: install
        run: npm ci

      - name: build
        run: npm run build

      - name: Test
        run: npm run test:ci

      - name: Circular reference
        if: ${{ matrix.node_version == '20' }}
        run: npm run circular

      - name: Lint
        if: ${{ matrix.node_version == '20' }}
        run: npm run lint

      - name: Prettier
        if: ${{ matrix.node_version == '20' }}
        run: npm run prettier

      - name: Coverage
        if: ${{ matrix.node_version == '20' }}
        run: npm run coverage:ci

      - name: SonarCloud Scan
        if: ${{ matrix.node_version == '20' }}
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # 8.2.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
